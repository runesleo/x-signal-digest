<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Signal Digest Loop：再也不用主动刷 X</title>
  <desc id="desc">匿名真实轮次从 80 条扫描内容筛选为 23 条初筛、12 条语义审查、3 条值得知道和 1 条正式晋升。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091019"/>
      <stop offset="1" stop-color="#0d1720"/>
    </linearGradient>
    <linearGradient id="blue-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17344a"/>
      <stop offset="1" stop-color="#122638"/>
    </linearGradient>
    <linearGradient id="green-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16473e"/>
      <stop offset="1" stop-color="#11332f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <style>
      .font { font-family: Inter, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .label { fill: #90a1b2; font-size: 19px; font-weight: 500; letter-spacing: 1.6px; }
      .number { fill: #f4f7fb; font-size: 68px; font-weight: 700; }
      .stage { fill: #f4f7fb; font-size: 25px; font-weight: 600; }
      .note { fill: #a8b5c2; font-size: 18px; font-weight: 400; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1460" cy="20" r="260" fill="#16354a" opacity="0.20"/>
  <circle cx="80" cy="890" r="270" fill="#12352f" opacity="0.16"/>

  <g class="font">
    <text x="80" y="74" fill="#e8eef5" font-size="27" font-weight="650">Signal Digest Loop</text>
    <text x="80" y="106" fill="#718293" font-size="16" font-weight="500" letter-spacing="2.2">LOCAL-FIRST · MODEL-NEUTRAL · RECEIPT-BOUND</text>

    <rect x="1240" y="55" width="280" height="48" rx="24" fill="#12352f" stroke="#3cb596" stroke-width="1.5"/>
    <text x="1380" y="86" text-anchor="middle" fill="#9de7d4" font-size="17" font-weight="600">匿名真实轮次</text>

    <text x="80" y="205" fill="#f6f8fb" font-size="68" font-weight="750">再也不用主动刷 X</text>
    <text x="80" y="258" fill="#a8b5c2" font-size="25" font-weight="400">自动读取你的信息流，只留下真正值得知道、值得进入系统的内容。</text>

    <g filter="url(#shadow)">
      <rect x="80" y="340" width="220" height="190" rx="24" fill="#18222d" stroke="#344453" stroke-width="1.5"/>
      <text x="106" y="382" class="label">SCAN</text>
      <text x="106" y="457" class="number">80</text>
      <text x="106" y="500" class="stage">条不同内容</text>

      <rect x="350" y="340" width="220" height="190" rx="24" fill="#18222d" stroke="#344453" stroke-width="1.5"/>
      <text x="376" y="382" class="label">GATE</text>
      <text x="376" y="457" class="number">23</text>
      <text x="376" y="500" class="stage">条通过初筛</text>

      <rect x="620" y="340" width="220" height="190" rx="24" fill="#18222d" stroke="#344453" stroke-width="1.5"/>
      <text x="646" y="382" class="label">REVIEW</text>
      <text x="646" y="457" class="number">12</text>
      <text x="646" y="500" class="stage">条语义审查</text>

      <rect x="890" y="340" width="250" height="190" rx="24" fill="url(#blue-card)" stroke="#4c9bca" stroke-width="1.8"/>
      <text x="916" y="382" class="label" fill="#8fc9ec">KNOW</text>
      <text x="916" y="457" class="number">3</text>
      <text x="916" y="500" class="stage">条值得知道</text>

      <rect x="1190" y="340" width="330" height="190" rx="24" fill="url(#green-card)" stroke="#46b99b" stroke-width="1.8"/>
      <text x="1218" y="382" class="label" fill="#93ddc9">COMMIT</text>
      <text x="1218" y="457" class="number">1</text>
      <text x="1218" y="500" class="stage">条正式晋升</text>
    </g>

    <g stroke="#7f91a2" stroke-width="2" fill="none" opacity="0.9">
      <path d="M300 435 H334"/>
      <path d="M570 435 H604"/>
      <path d="M840 435 H874"/>
      <path d="M1140 435 H1174"/>
    </g>
    <g fill="#7f91a2">
      <path d="M334 435 l-12 -8 v16 z"/>
      <path d="M604 435 l-12 -8 v16 z"/>
      <path d="M874 435 l-12 -8 v16 z"/>
      <path d="M1174 435 l-12 -8 v16 z"/>
    </g>

    <rect x="80" y="605" width="170" height="44" rx="22" fill="#2a241b" stroke="#8c6b38" stroke-width="1.4"/>
    <text x="165" y="634" text-anchor="middle" fill="#efc579" font-size="17" font-weight="650">0 条也合法</text>

    <text x="80" y="705" fill="#f1f5f9" font-size="36" font-weight="700">不是日报，是信息路由器。</text>
    <text x="80" y="750" class="note">已知内容不重复 · 重要说法有证据边界 · 每一步都有回执</text>

    <g>
      <rect x="930" y="620" width="170" height="112" rx="20" fill="#14232f" stroke="#36576f" stroke-width="1.4"/>
      <text x="1015" y="664" text-anchor="middle" fill="#86c9ee" font-size="18" font-weight="650" letter-spacing="1.2">KNOW</text>
      <text x="1015" y="700" text-anchor="middle" fill="#dce8f1" font-size="19">了解重要信号</text>

      <rect x="1120" y="620" width="170" height="112" rx="20" fill="#14232f" stroke="#36576f" stroke-width="1.4"/>
      <text x="1205" y="664" text-anchor="middle" fill="#86c9ee" font-size="18" font-weight="650" letter-spacing="1.2">DO</text>
      <text x="1205" y="700" text-anchor="middle" fill="#dce8f1" font-size="19">进入研究 / 行动</text>

      <rect x="1310" y="620" width="210" height="112" rx="20" fill="#15352f" stroke="#3ba587" stroke-width="1.4"/>
      <text x="1415" y="664" text-anchor="middle" fill="#91dfca" font-size="18" font-weight="650" letter-spacing="1.2">CREATE</text>
      <text x="1415" y="700" text-anchor="middle" fill="#dff5ef" font-size="19">进入内容队列</text>
    </g>

    <line x1="80" y1="822" x2="1520" y2="822" stroke="#273541" stroke-width="1"/>
    <text x="80" y="858" fill="#708294" font-size="16">匿名聚合展示：不包含账号、原帖正文、私人兴趣或内部任务。</text>
    <text x="1520" y="858" text-anchor="end" fill="#708294" font-size="16">80 → 23 → 12 → 3 → 1</text>
  </g>
</svg>
