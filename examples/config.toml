# All paths are relative to this configuration file.
state_dir = ".state"

[loop]
freshness_hours = 48
shortlist_limit = 5
promotion_threshold = 0.55
processed_ttl_hours = 336

[limits]
max_source_bytes = 10485760
max_rows = 5000
max_line_bytes = 262144
max_errors = 50
max_engagement_depth = 4

[analyzer]
command = ["python3", "rule_based_analyzer.py"]
timeout_seconds = 30

[[sources]]
name = "fictional-lab-feed"
type = "json"
path = "sources/fictional_feed.json"
items_path = "items"
weight = 1.0
freshness_hours = 72
enabled = true

[sources.fields]
title = "title"
url = "url"
text = "summary"
engagement = "engagement"
