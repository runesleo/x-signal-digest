[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-digest-loop"
version = "0.1.0"
description = "An offline-first, configurable signal ingestion and digestion loop."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Signal Digest Loop contributors" }]
keywords = ["signals", "information-processing", "automation", "offline-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.scripts]
signal-digest = "signal_digest_loop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
